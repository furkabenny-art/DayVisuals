name: Build DayVisuals
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Code
        uses: actions/checkout@v4
        with:
          path: my-repo

      - name: Checkout Official Fabric Template
        uses: actions/checkout@v4
        with:
          repository: FabricMC/fabric-example-mod
          ref: '1.21'
          path: fabric-project

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Inject Your Visuals Code
        run: |
          cd fabric-project
          rm -rf src/main/java/*
          rm -rf src/main/resources/*
          
          mkdir -p src/main/java/dayvisuals
          mkdir -p src/main/resources
          
          # Сначала распаковываем оставшиеся конфиги и миксины из твоего старого ZIP
          unzip ../my-repo/dayvisuals.zip -d ../temp_src || true
          cp ../temp_src/dayvisuals/*.json src/main/resources/ || true
          cp ../temp_src/dayvisuals/*Mixin.java src/main/java/dayvisuals/ || true
          
          # А главный исправленный файл копируем напрямую из репозитория, заменяя кривой из архива
          cp ../my-repo/DayVisuals.java src/main/java/dayvisuals/
          
          sed -i 's/"minecraft": ">=1.21"/"minecraft": "1.21.11"/g' src/main/resources/fabric.mod.json || true
          sed -i 's/1.21/1.21.11/g' build.gradle || true

      - name: Compile Jar Mod via Template Gradle
        run: |
          cd fabric-project
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload DayVisuals Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: DayVisuals-Jar
          path: fabric-project/build/libs/*-1.0.0.jar
