name: Build DayVisuals
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download and Setup Official Template
        run: |
          # Скачиваем стабильный легковесный шаблон проекта Fabric
          curl -L https://github.com -o project.zip
          unzip project.zip
          mv fabric-example-mod-1.21 project-dir
          
          cd project-dir
          # Вычищаем дефолтные файлы шаблона
          rm -rf src/main/java/*
          rm -rf src/main/resources/*
          
          # Создаем чистые папки под твои пакеты
          mkdir -p src/main/java/dayvisuals
          mkdir -p src/main/resources
          
          # Распаковываем твой архив dayvisuals.zip
          unzip ../dayvisuals.zip -d ../temp_src
          
          # Раскладываем твои 5 файлов по нужным системным папкам
          cp ../temp_src/dayvisuals/*.java src/main/java/dayvisuals/
          cp ../temp_src/dayvisuals/*.json src/main/resources/
          
          # Жестко прописываем версию 1.21.11 в официальных файлах конфигурации
          sed -i 's/"minecraft": ">=1.21"/"minecraft": "1.21.11"/g' src/main/resources/fabric.mod.json || true
          sed -i 's/1.21/1.21.11/g' build.gradle || true

      - name: Compile Jar Mod via Template Gradle
        run: |
          cd project-dir
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload DayVisuals Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: DayVisuals-Jar
          path: project-dir/build/libs/*-1.0.0.jar
