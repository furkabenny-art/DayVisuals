name: Build DayVisuals
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Pure Project From Archive Only
        run: |
          # 1. Создаём пустой файл настроек settings.gradle
          touch settings.gradle
          
          # 2. Скачиваем официальный легковесный компилятор Gradle
          gradle wrapper --gradle-version 8.7
          
          # 3. Создаём правильную структуру папок для Fabric-мода 1.21.11
          mkdir -p src/main/java/dayvisuals
          mkdir -p src/main/resources
          
          # 4. Распаковываем твой архив со всеми исходниками
          unzip dayvisuals.zip -d temp_src
          
          # 5. Переносим твои 5 файлов из подпапки dayvisuals в нужные места проекта
          cp temp_src/dayvisuals/*.java src/main/java/dayvisuals/
          cp temp_src/dayvisuals/*.json src/main/resources/
          
          # 6. Создаём файл сборки build.gradle с плагином Fabric Loom
          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version '1.7-SNAPSHOT'
              id 'maven-publish'
          }
          version = '1.0.0'
          group = 'net.dayvisuals'
          repositories {
              maven { url "https://fabricmc.net" }
              mavenCentral()
          }
          dependencies {
              minecraft "com.mojang:minecraft:1.21.11"
              mappings "net.fabricmc:yarn:1.21.11+build.1:v2"
              modImplementation "net.fabricmc:fabric-loader:0.15.11"
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.102.0+1.21.11"
          }
          EOF
          
          # 7. Создаём файл настроек gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2G
          EOF

      - name: Compile Jar Mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload DayVisuals Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: DayVisuals-Jar
          path: build/libs/*-1.0.0.jar
          
