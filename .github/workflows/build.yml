name: Build DayVisuals
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Lightweight Fabric Project
        run: |
          git clone --depth 1 https://github.com fabric-project
          cd fabric-project
          
          rm -rf src/main/java/*
          rm -rf src/main/resources/*
          
          mkdir -p src/main/java/dayvisuals
          mkdir -p src/main/resources
          
          unzip ../dayvisuals.zip -d ../temp_src
          
          cp ../temp_src/*.java src/main/java/dayvisuals/
          cp ../temp_src/*.json src/main/resources/
          
          sed -i 's/"minecraft": ">=1.21"/"minecraft": "1.21.11"/g' src/main/resources/fabric.mod.json || true
          sed -i 's/1.21/1.21.11/g' build.gradle || true

      - name: Compile Jar via Gradle
        run: |
          cd fabric-project
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload DayVisuals Mod
        uses: actions/upload-artifact@v4
        with:
          name: DayVisuals-Jar
          path: fabric-project/build/libs/*-1.0.0.jar
